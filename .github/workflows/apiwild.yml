name: API WILD checks
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: America/Winnipeg
permissions:
  contents: read
concurrency:
  group: apiwild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Prepare isolated CI hosting configuration
        run: node scripts/prepare-ci.mjs
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Build and test
        run: npm test
      - name: Verify owned gateway authentication and assembly
        run: node --test infra/railway/tests/gateway-ingress.test.mjs infra/railway/tests/owned-gateway-assembly.test.mjs infra/railway/tests/supabase-gateway-rpc.test.mjs
  production-health:
    needs: build-and-test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Check production routes, access boundaries and email DNS
        env:
          APIWILD_GATEWAY_OPERATIONS_SECRET: ${{ secrets.APIWILD_GATEWAY_OPERATIONS_SECRET }}
        run: node scripts/daily-health.mjs
