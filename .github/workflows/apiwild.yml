name: API WILD checks
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: America/Winnipeg
permissions:
  contents: read
concurrency:
  group: apiwild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Prepare isolated CI hosting configuration
        run: node scripts/prepare-ci.mjs
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Build and test
        run: npm test
      - name: Verify gateway, supplier accounting and welcome boundaries
        run: >-
          node --test
          infra/railway/tests/gateway-ingress.test.mjs
          infra/railway/tests/research-tools-ingress.test.mjs
          infra/railway/tests/owned-gateway-assembly.test.mjs
          infra/railway/tests/supabase-gateway-rpc.test.mjs
          infra/railway/tests/gateway-discovery.test.mjs
          infra/railway/tests/owned-discovery-http.test.mjs
          infra/railway/tests/gateway-service.test.mjs
          infra/railway/tests/chat-compatibility.test.mjs
          infra/railway/tests/subrouter-dispatch.test.mjs
          infra/railway/tests/subrouter-request-binding.test.mjs
          infra/railway/tests/supplier-request-identity.test.mjs
          infra/railway/tests/owned-text-modes.test.mjs
          infra/railway/tests/subrouter-receipt-reader.test.mjs
          infra/railway/tests/supplier-debit-sweep.test.mjs
          infra/railway/tests/supplier-startup-probe.test.mjs
          infra/railway/tests/sandbox-e2e-harness.test.mjs
          infra/railway/tests/launch-status.test.mjs
          infra/railway/tests/release-acceptance.test.mjs
          infra/railway/tests/supplier-allowance.test.mjs
          infra/railway/tests/supplier-allowance-operator.test.mjs
          infra/railway/tests/reservation-expiry-operator.test.mjs
          infra/railway/tests/reservation-expiry-sweep.test.mjs
          infra/railway/tests/deepseek-tier-policy.test.mjs
          infra/railway/tests/deepseek-assembly.test.mjs
          infra/railway/tests/gateway-quote-lookup.test.mjs
          infra/railway/tests/retail-token-pricing.test.mjs
          infra/railway/tests/model-accounting.test.mjs
          infra/railway/tests/welcome-brand.test.mjs
          infra/railway/tests/welcome-rpc.test.mjs
          infra/railway/tests/container-context.test.mjs
          infra/railway/tests/stripe-checkout.test.mjs
          infra/railway/tests/owned-billing.test.mjs
          infra/railway/tests/credit-offers.test.mjs
          infra/railway/tests/stripe-financial-projection.test.mjs
          infra/railway/tests/stripe-projection-rpc.test.mjs
          infra/railway/tests/stripe-webhook-ingress.test.mjs
          infra/railway/preparation.test.mjs
      - name: Verify credit promotion with isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/apiwild-promotion-pglite" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          node tests/integration/credit-promotion-pglite.mjs "$RUNNER_TEMP/apiwild-promotion-pglite/node_modules/@electric-sql/pglite/dist/index.js"
  production-health:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      operational-healthy: ${{ steps.health.outputs.operational-healthy }}
      launch-ready: ${{ steps.health.outputs.launch-ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Check production routes, access boundaries and email DNS
        id: health
        env:
          APIWILD_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/daily-health.mjs
  launch-readiness:
    needs: [build-and-test, production-health]
    if: always() && needs.build-and-test.result == 'success' && needs.production-health.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require observed operational health and accepted launch readiness
        env:
          OPERATIONAL_HEALTHY: ${{ needs.production-health.outputs.operational-healthy }}
          LAUNCH_READY: ${{ needs.production-health.outputs.launch-ready }}
        run: |
          echo "operationalHealthy: ${OPERATIONAL_HEALTHY:-unverified}"
          echo "launchReady: ${LAUNCH_READY:-unverified}"
          if [ "$OPERATIONAL_HEALTHY" != "true" ] || [ "$LAUNCH_READY" != "true" ]; then
            echo "Launch remains blocked. Operational health alone does not authorize customer launch."
            exit 1
          fi
