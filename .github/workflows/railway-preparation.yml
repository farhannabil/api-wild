name: Railway source preparation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apiwild-railway-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guarded-node-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact source and locked Vinext version
        run: node infra/railway/preflight.mjs
      - name: Check ingress and mail contracts without external calls
        run: node --test infra/railway/preparation.test.mjs tests/railway-email-outbox.test.mjs
      - name: Build the closed preparation runtime
        run: docker build --file Dockerfile.railway --tag apiwild-preparation:${{ github.sha }} .
      # No deployment, production credential, email send or automatic DB migration.
